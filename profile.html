<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BrainStack Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#F9FAFB;
    color:#111827;

    display:flex;
    justify-content:center;
    align-items:center;

    min-height:100vh;
    padding:20px;
}

.profile-card{

    width:100%;
    max-width:500px;

    background:white;

    border-radius:20px;

    padding:40px;

    text-align:center;

    border:1px solid #E5E7EB;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.08);
}

.profile-card img{

    width:120px;
    height:120px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #111827;

    margin-bottom:20px;
}

.profile-card h1{
    margin-bottom:20px;
}

.info{
    text-align:left;
    margin-top:25px;
}

.info p{
    margin-bottom:15px;
    font-size:1.05rem;
}

.label{
    font-weight:600;
}

.btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    margin-top:15px;

    font-size:16px;

    font-weight:600;
}

.logout-btn{
    background:#111827;
    color:white;
}

.delete-btn{
    background:#dc2626;
    color:white;
}

.home-btn{
    background:#2563eb;
    color:white;
}

</style>

</head>
<body>

<div class="profile-card">

    <img id="profileImage"
    src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <h1>My Profile</h1>

    <div class="info">

        <p>
            <span class="label">Name:</span>
            <span id="userName">Loading...</span>
        </p>

        <p>
            <span class="label">Email:</span>
            <span id="userEmail">Loading...</span>
        </p>

        <p>
            <span class="label">Provider:</span>
            <span id="provider">Google</span>
        </p>

    </div>

    <button class="btn home-btn"
    onclick="window.location.href='index.html'">
        Back To Home
    </button>

    <button id="logoutBtn"
    class="btn logout-btn">
        Logout
    </button>

    <button id="deleteBtn"
    class="btn delete-btn">
        Delete Account
    </button>

</div>


</body>

</html>
