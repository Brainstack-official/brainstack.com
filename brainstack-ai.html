<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BrainStack AI Assistant</title>
<style>
:root {
  --blue:#2563EB; --purple:#7C3AED; --green:#10B981; --red:#EF4444;
  --dark:#0F172A; --mid:#334155; --muted:#94A3B8;
  --bg:#F1F5F9; --white:#FFFFFF; --code-bg:#1E293B;
  --border:#E2E8F0; --tint:#EFF6FF; --light:#DBEAFE;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
button{font-family:'Inter',sans-serif;cursor:pointer;}
body{font-family:'Inter',sans-serif;background:var(--bg);height:100dvh;display:flex;flex-direction:column;overflow:hidden;}

#header{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 18px;background:var(--white);border-bottom:1px solid var(--border);box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--blue);}
.logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;}
.badge{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
#hright{margin-left:auto;display:flex;align-items:center;gap:8px;}
.sdot{width:8px;height:8px;background:var(--green);border-radius:50%;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}
.stxt{font-size:12px;color:var(--green);font-weight:600;}
.ibtn{width:32px;height:32px;border:1.5px solid var(--border);border-radius:50%;background:var(--white);display:flex;align-items:center;justify-content:center;font-size:14px;}
.ibtn:hover{background:var(--tint);border-color:var(--blue);}
.ibtn.listening{background:var(--red);border-color:var(--red);}

#pills{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:9px 18px;background:var(--white);border-bottom:1px solid var(--border);overflow-x:auto;scrollbar-width:none;}
#pills::-webkit-scrollbar{display:none;}
.pl{font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;margin-right:2px;}
.pill{flex-shrink:0;background:var(--tint);color:var(--blue);border:1px solid var(--light);border-radius:20px;padding:4px 11px;font-size:11px;font-weight:500;white-space:nowrap;transition:.15s;}
.pill:hover{background:var(--blue);color:#fff;}

#chat{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:16px;max-width:800px;width:100%;margin:0 auto;scrollbar-width:thin;scrollbar-color:var(--border) transparent;}

#welcome{text-align:center;padding:24px 12px;}
#welcome .bi{font-size:48px;margin-bottom:10px;}
#welcome h2{font-size:20px;font-weight:700;color:var(--dark);margin-bottom:6px;}
#welcome p{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:18px;max-width:360px;margin-left:auto;margin-right:auto;}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;max-width:460px;margin:0 auto;}
.qbtn{background:var(--white);border:1.5px solid var(--border);border-radius:12px;padding:11px 12px;font-size:12px;color:var(--mid);text-align:left;line-height:1.45;transition:.15s;}
.qbtn .qi{font-size:18px;display:block;margin-bottom:4px;}
.qbtn:hover{border-color:var(--blue);background:var(--tint);color:var(--blue);}

.msg{display:flex;gap:9px;animation:rise .25s ease;}
@keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.msg.user{flex-direction:row-reverse;}
.av{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;align-self:flex-start;}
.av.ai{background:linear-gradient(135deg,var(--blue),var(--purple));}
.av.user{background:var(--dark);}
.mr{display:flex;flex-direction:column;max-width:78%;}
.msg.user .mr{align-items:flex-end;}
.bubble{padding:12px 14px;border-radius:16px;font-size:13.5px;line-height:1.75;}
.msg.ai .bubble{background:var(--white);color:var(--dark);border:1px solid var(--border);border-top-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
.msg.user .bubble{background:var(--blue);color:#fff;border-top-right-radius:4px;}
.ts{font-size:10px;color:var(--muted);margin-top:3px;padding:0 2px;}

.typing{display:flex;gap:5px;align-items:center;padding:12px 14px;}
.typing span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:dot 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes dot{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-5px);}}

.bubble h3{font-size:14px;font-weight:700;margin:10px 0 5px;}
.bubble strong{font-weight:600;}
.bubble ul,.bubble ol{padding-left:18px;margin:5px 0;}
.bubble li{margin:3px 0;}
.bubble code{font-family:'JetBrains Mono',monospace;font-size:12px;background:#F1F5F9;color:var(--purple);padding:2px 5px;border-radius:4px;}
.bubble pre{position:relative;background:var(--code-bg);color:#E2E8F0;font-family:'JetBrains Mono',monospace;font-size:12px;padding:14px;border-radius:8px;overflow-x:auto;margin:10px 0;line-height:1.6;}
.bubble pre code{background:none;color:inherit;padding:0;}
.cpbtn{position:absolute;top:8px;right:8px;background:#334155;color:#94A3B8;border:none;font-size:10px;padding:3px 8px;border-radius:5px;font-family:'Inter',sans-serif;}
.cpbtn:hover{background:#475569;color:#fff;}

.rc{display:flex;align-items:center;gap:10px;border-radius:8px;padding:10px 12px;margin-top:9px;border:1px solid;transition:opacity .2s;}
.rc:hover{opacity:.85;}
.rc.pdf{background:var(--tint);border-color:var(--light);}
.rc.rm{background:#F0FDF4;border-color:#BBF7D0;}
.ri{font-size:18px;flex-shrink:0;}
.rinfo{flex:1;}
.rt{font-size:12px;font-weight:600;}
.rc.pdf .rt{color:var(--blue);}
.rc.rm .rt{color:var(--green);}
.rs{font-size:11px;color:var(--muted);margin-top:1px;}
.ra{font-size:14px;font-weight:700;color:var(--muted);}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.chip{background:var(--tint);border:1px solid var(--light);color:var(--blue);font-size:11px;padding:4px 10px;border-radius:20px;transition:.15s;}
.chip:hover{background:var(--blue);color:#fff;}

#ia{flex-shrink:0;background:var(--white);border-top:1px solid var(--border);padding:12px 16px;}
#iw{max-width:800px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:#F8FAFF;border:1.5px solid var(--border);border-radius:16px;padding:8px 8px 8px 14px;transition:border-color .2s;}
#iw:focus-within{border-color:var(--blue);}
#ui{flex:1;border:none;background:transparent;font-family:'Inter',sans-serif;font-size:13.5px;color:var(--dark);resize:none;outline:none;max-height:100px;min-height:22px;line-height:1.5;}
#ui::placeholder{color:var(--muted);}
#sb{width:36px;height:36px;background:var(--blue);border:none;border-radius:10px;color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
#sb:hover{background:#1D4ED8;transform:scale(1.05);}
#sb:disabled{background:var(--border);transform:none;cursor:default;}
#ih{text-align:center;font-size:10.5px;color:var(--muted);margin-top:6px;}

@media(max-width:500px){.qgrid{grid-template-columns:1fr;}.mr{max-width:88%;}#chat{padding:14px 12px;}#header{padding:10px 12px;}}
</style>
</head>
<body>

<div id="header">
  <div class="logo"><div class="logo-icon">🧠</div>BrainStack</div>
  <span class="badge">AI</span>
  <div id="hright">
    <div class="sdot"></div><span class="stxt">Online</span>
    <button class="ibtn" id="vbtn" title="Voice" onclick="toggleVoice()">🎤</button>
    <button class="ibtn" title="Clear" onclick="clearChat()">🗑️</button>
  </div>
</div>

<div id="pills">
  <span class="pl">Topics:</span>
  <button class="pill" onclick="ask('Engineering Hub resources')">⚙️ Engineering</button>
  <button class="pill" onclick="ask('Bachelor of Science subjects')">🔬 B.Sc</button>
  <button class="pill" onclick="ask('Programming languages guide')">💻 Programming</button>
  <button class="pill" onclick="ask('Web development roadmap')">🌐 Web Dev</button>
  <button class="pill" onclick="ask('Artificial intelligence and machine learning')">🤖 AI & ML</button>
  <button class="pill" onclick="ask('BrainStack Library resources')">📚 Library</button>
  <button class="pill" onclick="ask('Give me a project with full code')">🛠️ Projects</button>
  <button class="pill" onclick="ask('Show me a learning roadmap')">🗺️ Roadmaps</button>
</div>

<div id="chat">
  <div id="welcome">
    <div class="bi">🧠</div>
    <h2>Hi, I'm BrainStack AI!</h2>
    <p>Your personal education guide. Ask me about any subject, get project code, or explore a learning roadmap.</p>
    <div class="qgrid">
      <button class="qbtn" onclick="ask('How do I become a full stack web developer? Give me a complete roadmap')"><span class="qi">🌐</span>Full Stack Developer Roadmap</button>
      <button class="qbtn" onclick="ask('Give me a complete HTML CSS JavaScript project with full code')"><span class="qi">💻</span>Web project with full code</button>
      <button class="qbtn" onclick="ask('Explain machine learning with examples')"><span class="qi">🤖</span>Explain Machine Learning</button>
      <button class="qbtn" onclick="ask('Explain thermodynamics for mechanical engineering')"><span class="qi">⚙️</span>Mechanical Engineering basics</button>
      <button class="qbtn" onclick="ask('Give me a Python beginner project with full code')"><span class="qi">🐍</span>Python beginner project</button>
      <button class="qbtn" onclick="ask('What is BrainStack and who created it?')"><span class="qi">💡</span>About BrainStack</button>
    </div>
  </div>
</div>

<div id="ia">
  <div id="iw">
    <textarea id="ui" rows="1" placeholder="Ask me any education question, project idea, or roadmap…" onkeydown="onKey(event)" oninput="rsz(this)"></textarea>
    <button id="sb" onclick="send()">➤</button>
  </div>
  <div id="ih">BrainStack AI · Education only · by Shaik Mohammed Rehan</div>
</div>

<script>
/* ============================================================
   ➜ STEP 1: PASTE YOUR GEMINI API KEY HERE
   Get it from: aistudio.google.com
   Then go to Google Cloud Console → restrict key to:
   HTTP referrers: brainstack-com.vercel.app/*
============================================================ */
const GEMINI_KEY = "AQ.Ab8RN6L0teZqil2KEvY0LpLblluOV0ZdrOb42TL3-ufk_Xq2gQ";

/* ============================================================
   RESOURCE DATABASE
   ➜ To add PDF: copy one block, update name/url/keywords
============================================================ */
const RESOURCES = [
  {name:"Mechanical Engineering Notes",category:"Engineering Hub",emoji:"⚙️",url:"https://brainstack-com.vercel.app/engineering-hub/mechanical-resources.html",keywords:["mechanical","thermodynamics","fluid","manufacturing","heat transfer"]},
  {name:"Civil Engineering Notes",category:"Engineering Hub",emoji:"🏗️",url:"https://brainstack-com.vercel.app/engineering-hub/civil-resources.html",keywords:["civil","construction","structural","concrete","surveying"]},
  {name:"ECE Engineering Notes",category:"Engineering Hub",emoji:"📡",url:"https://brainstack-com.vercel.app/engineering-hub/ece-resources.html",keywords:["electronics","electrical","circuit","microcontroller","arduino"]},
  {name:"CSE / IT Engineering Notes",category:"Engineering Hub",emoji:"💻",url:"https://brainstack-com.vercel.app/engineering-hub/cse-resources.html",keywords:["computer science","software","operating system","networks","cse"]},
  {name:"B.Sc Mathematics Notes",category:"Bachelor of Science",emoji:"📐",url:"https://brainstack-com.vercel.app/bsc/mathematics.html",keywords:["mathematics","calculus","algebra","trigonometry","statistics"]},
  {name:"B.Sc Physics Notes",category:"Bachelor of Science",emoji:"⚛️",url:"https://brainstack-com.vercel.app/bsc/physics.html",keywords:["physics","optics","quantum","mechanics","waves"]},
  {name:"B.Sc Chemistry Notes",category:"Bachelor of Science",emoji:"🧪",url:"https://brainstack-com.vercel.app/bsc/chemistry.html",keywords:["chemistry","organic","inorganic","reaction","periodic"]},
  {name:"B.Sc Botany Notes",category:"Bachelor of Science",emoji:"🌿",url:"https://brainstack-com.vercel.app/bsc/botany.html",keywords:["botany","plant","biology","photosynthesis","ecology"]},
  {name:"B.Sc Zoology Notes",category:"Bachelor of Science",emoji:"🦁",url:"https://brainstack-com.vercel.app/bsc/zoology.html",keywords:["zoology","animal","genetics","evolution"]},
  {name:"Python Programming Guide",category:"Programming",emoji:"🐍",url:"https://brainstack-com.vercel.app/programming/python.html",keywords:["python","django","flask","pandas","numpy","automation"]},
  {name:"Java Programming Guide",category:"Programming",emoji:"☕",url:"https://brainstack-com.vercel.app/programming/java.html",keywords:["java","oops","spring","inheritance","polymorphism"]},
  {name:"Data Structures & Algorithms",category:"Programming",emoji:"📊",url:"https://brainstack-com.vercel.app/programming/dsa.html",keywords:["data structure","algorithm","sorting","tree","graph","linked list","dsa"]},
  {name:"Database Management (DBMS)",category:"Programming",emoji:"🗄️",url:"https://brainstack-com.vercel.app/programming/dbms.html",keywords:["database","sql","mysql","mongodb","nosql","dbms"]},
  {name:"Cyber Security Guide",category:"Programming",emoji:"🔒",url:"https://brainstack-com.vercel.app/programming/cyber-security.html",keywords:["cyber security","hacking","ethical hacking","encryption","malware"]},
  {name:"HTML & CSS Complete Guide",category:"Web Development",emoji:"🌐",url:"https://brainstack-com.vercel.app/web-dev/html-css.html",keywords:["html","css","web design","responsive","bootstrap","tailwind","flexbox"]},
  {name:"JavaScript Guide",category:"Web Development",emoji:"⚡",url:"https://brainstack-com.vercel.app/web-dev/javascript.html",keywords:["javascript","js","es6","async","promise","dom","json"]},
  {name:"React & Frontend Frameworks",category:"Web Development",emoji:"⚛️",url:"https://brainstack-com.vercel.app/web-dev/react.html",keywords:["react","vue","angular","component","hooks","next.js"]},
  {name:"Node.js & Backend Guide",category:"Web Development",emoji:"🖧",url:"https://brainstack-com.vercel.app/web-dev/nodejs.html",keywords:["nodejs","express","backend","rest api","server","full stack"]},
  {name:"Artificial Intelligence Guide",category:"Artificial Intelligence",emoji:"🤖",url:"https://brainstack-com.vercel.app/ai-lab/ai-resources.html",keywords:["artificial intelligence","ai","expert system"]},
  {name:"Machine Learning Guide",category:"Artificial Intelligence",emoji:"📈",url:"https://brainstack-com.vercel.app/ai-lab/machine-learning.html",keywords:["machine learning","ml","supervised","regression","classification","scikit"]},
  {name:"Deep Learning & Neural Networks",category:"Artificial Intelligence",emoji:"🧠",url:"https://brainstack-com.vercel.app/ai-lab/deep-learning.html",keywords:["deep learning","neural network","cnn","tensorflow","pytorch","keras","nlp"]},
  {name:"Data Science Guide",category:"Artificial Intelligence",emoji:"📊",url:"https://brainstack-com.vercel.app/ai-lab/data-science.html",keywords:["data science","visualization","matplotlib","pandas","jupyter"]},
  {name:"BrainStack Digital Library",category:"BrainStack Library",emoji:"📚",url:"https://brainstack-com.vercel.app/library.html",keywords:["library","ebook","book","reference","textbook","notes"]}
  /* ➜ ADD MORE: ,{name:"Name",category:"Cat",emoji:"📄",url:"https://link",keywords:["kw1","kw2"]} */
];

const ROADMAPS = [
  {name:"Full Stack Web Developer Roadmap",emoji:"🌐",url:"https://brainstack-com.vercel.app/roadmaps/web-dev.html",keywords:["full stack","web developer","frontend","backend"]},
  {name:"AI & Machine Learning Roadmap",emoji:"🤖",url:"https://brainstack-com.vercel.app/roadmaps/ai-ml.html",keywords:["ai roadmap","machine learning roadmap","data science"]},
  {name:"Cyber Security Roadmap",emoji:"🔒",url:"https://brainstack-com.vercel.app/roadmaps/cyber.html",keywords:["cyber security roadmap","ethical hacker"]},
  {name:"Python Developer Roadmap",emoji:"🐍",url:"https://brainstack-com.vercel.app/roadmaps/python.html",keywords:["python roadmap","become python developer"]},
  {name:"DSA & Competitive Programming",emoji:"📊",url:"https://brainstack-com.vercel.app/roadmaps/dsa.html",keywords:["dsa roadmap","competitive programming","coding interview"]}
];

/* SYSTEM PROMPT */
function sysPrompt(){
  return `You are BrainStack AI, a smart friendly education assistant for BrainStack (brainstack-com.vercel.app), created by Shaik Mohammed Rehan.

BrainStack has 6 study categories: Engineering Hub, Bachelor of Science, Programming, Web Development, Artificial Intelligence, BrainStack Library.

YOUR JOB: Explain education topics clearly, give COMPLETE working code for projects, provide step-by-step roadmaps, answer university exam questions.

STRICT RULE — EDUCATION ONLY: Only answer about subjects, concepts, coding, projects, roadmaps, exams, tech/science careers. For anything outside education reply ONLY: "I'm BrainStack AI and I only help with education topics! 📚 Ask me about any subject, project, or roadmap 😊"

CODE: Always give complete runnable commented code with triple backticks.
FORMAT: Use **bold**, bullet points, ### headers.
ABOUT: If asked who made you — "Created by Shaik Mohammed Rehan, founder of BrainStack 🧠"`;
}

/* STATE */
let history=[], busy=false;

/* INTENT */
function intent(t){
  const s=t.toLowerCase();
  if(/^(hi|hello|hey|hii|good morning|good evening|namaste)\b/.test(s.trim()))return"greet";
  if(/(who (made|created)|about brainstack|founder|rehan|what is brainstack)/.test(s))return"about";
  if(/(thank|thanks|awesome|well done|helpful)/.test(s))return"thanks";
  if(/(bye|goodbye|see you)/.test(s))return"bye";
  if(/(roadmap|how to become|learning path)/.test(s))return"roadmap";
  return"ai";
}

function matchRes(q){const s=q.toLowerCase();return RESOURCES.map(r=>({...r,sc:r.keywords.filter(k=>s.includes(k)).length})).filter(r=>r.sc>0).sort((a,b)=>b.sc-a.sc).slice(0,2);}
function matchRm(q){const s=q.toLowerCase();return ROADMAPS.find(r=>r.keywords.some(k=>s.includes(k)))||null;}

/* LOCAL REPLIES */
function local(it){
  const h=new Date().getHours(),g=h<12?"Good morning":h<17?"Good afternoon":"Good evening";
  if(it==="greet")return{t:`${g}! 👋 I'm BrainStack AI — your personal education guide. Ask me about any subject, get project code, or explore a roadmap. What would you like to study?`,c:["Give me a roadmap","I want a project","Explain a subject","About BrainStack"]};
  if(it==="about")return{t:`**BrainStack** is a free learning platform 🧠\n\n**👨‍💻 Created by:** Shaik Mohammed Rehan\n**🎯 Mission:** Free quality education for every student\n\n**6 Categories:**\n- Engineering Hub\n- Bachelor of Science\n- Programming\n- Web Development\n- Artificial Intelligence\n- BrainStack Library\n\n🌐 brainstack-com.vercel.app`,c:["Show resources","Give me a project","Learning roadmap"]};
  if(it==="thanks")return{t:["You're welcome! 😊 Keep studying — you're doing great!","Happy to help! 🎉 What else do you want to learn?","Glad that helped! 🚀 Want a project next?"][Math.floor(Math.random()*3)],c:[]};
  if(it==="bye")return{t:"Goodbye! 👋 Keep learning and building. Good luck! 🎓",c:[]};
  return null;
}

/* MAIN SEND — calls Gemini directly */
async function send(){
  const inp=document.getElementById("ui");
  const txt=inp.value.trim();
  if(!txt||busy)return;
  busy=true;
  document.getElementById("sb").disabled=true;
  inp.value=""; inp.style.height="auto";
  addMsg("user",txt);
  const it=intent(txt);
  const loc=local(it);
  if(loc){
    showTyping(); await delay(500); rmTyping();
    addMsg("ai",loc.t,{chips:loc.c});
  } else {
    history.push({role:"user",parts:[{text:txt}]});
    showTyping();
    try{
      const r=await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key="+GEMINI_KEY,
        {method:"POST",headers:{"Content-Type":"application/json"},
         body:JSON.stringify({
           system_instruction:{parts:[{text:sysPrompt()}]},
           contents:history
         })}
      );
      const d=await r.json();
      if(!r.ok){console.error("Gemini error:",d);throw new Error(d.error?.message||"API error");}
      const rep=d.candidates?.[0]?.content?.parts?.[0]?.text||"Sorry, no response. Try again!";
      rmTyping();
      addMsg("ai",rep,{pdfs:matchRes(txt),roadmap:it==="roadmap"?matchRm(txt):null});
      history.push({role:"model",parts:[{text:rep}]});
    }catch(e){
      rmTyping();
      addMsg("ai","⚠️ Error: "+e.message+"\n\nPlease check your API key is correct and has no restrictions blocking this site.");
      history.pop();
    }
  }
  busy=false;
  document.getElementById("sb").disabled=false;
  inp.focus();
}

/* UI HELPERS */
function addMsg(role,text,ex){
  ex=ex||{};
  var w=document.getElementById("welcome"); if(w)w.remove();
  var chat=document.getElementById("chat");
  var row=document.createElement("div"); row.className="msg "+role;
  var av=document.createElement("div"); av.className="av "+role; av.textContent=role==="ai"?"🧠":"👤";
  var mr=document.createElement("div"); mr.className="mr";
  var b=document.createElement("div"); b.className="bubble";
  if(role==="ai"){
    b.innerHTML=fmt(text);
    (ex.pdfs||[]).forEach(function(p){var c=document.createElement("a");c.className="rc pdf";c.href=p.url;c.target="_blank";c.innerHTML='<span class="ri">'+p.emoji+' 📄</span><div class="rinfo"><div class="rt">'+p.name+'</div><div class="rs">'+p.category+' · Open on BrainStack</div></div><span class="ra">→</span>';b.appendChild(c);});
    if(ex.roadmap){var rm=document.createElement("a");rm.className="rc rm";rm.href=ex.roadmap.url;rm.target="_blank";rm.innerHTML='<span class="ri">'+ex.roadmap.emoji+'</span><div class="rinfo"><div class="rt">'+ex.roadmap.name+'</div><div class="rs">View full roadmap →</div></div><span class="ra">→</span>';b.appendChild(rm);}
    if(ex.chips&&ex.chips.length){var cw=document.createElement("div");cw.className="chips";ex.chips.forEach(function(q){var c=document.createElement("button");c.className="chip";c.textContent=q;c.onclick=function(){ask(q);};cw.appendChild(c);});b.appendChild(cw);}
  } else {b.textContent=text;}
  var ts=document.createElement("div");ts.className="ts";ts.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  mr.appendChild(b);mr.appendChild(ts);row.appendChild(av);row.appendChild(mr);chat.appendChild(row);chat.scrollTop=chat.scrollHeight;
}

function fmt(t){
  return t
    .replace(/```(\w+)?\n?([\s\S]*?)```/g,function(_,l,c){var e=c.trim().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return'<pre><button class="cpbtn" onclick="cp(this)">Copy</button><code>'+e+'</code></pre>';})
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}
function cp(btn){navigator.clipboard.writeText(btn.nextElementSibling.textContent).then(function(){btn.textContent="Copied!";setTimeout(function(){btn.textContent="Copy";},2000);});}
function showTyping(){var c=document.getElementById("chat"),r=document.createElement("div");r.id="tr";r.className="msg ai";r.innerHTML='<div class="av ai">🧠</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';c.appendChild(r);c.scrollTop=c.scrollHeight;}
function rmTyping(){var e=document.getElementById("tr");if(e)e.remove();}
function delay(ms){return new Promise(function(r){setTimeout(r,ms);});}
function ask(t){document.getElementById("ui").value=t;send();}
function onKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}
function rsz(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,100)+"px";}
function clearChat(){if(!confirm("Clear chat?"))return;document.getElementById("chat").innerHTML='<div id="welcome" style="text-align:center;padding:24px 12px"><div style="font-size:48px">🧠</div><h2 style="font-size:20px;font-weight:700;color:#0F172A;margin-bottom:6px">BrainStack AI</h2><p style="font-size:13px;color:#94A3B8">Chat cleared! What would you like to study?</p></div>';history=[];}

/* VOICE */
var rec=null,lstn=false;
function toggleVoice(){
  if(!("webkitSpeechRecognition" in window||"SpeechRecognition" in window)){alert("Voice works in Chrome!");return;}
  if(lstn){rec.stop();return;}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  rec=new SR();rec.lang="en-US";rec.continuous=false;rec.interimResults=false;
  rec.onstart=function(){lstn=true;var b=document.getElementById("vbtn");b.classList.add("listening");b.textContent="🔴";document.getElementById("ui").placeholder="Listening…";};
  rec.onresult=function(e){document.getElementById("ui").value=e.results[0][0].transcript;};
  rec.onend=function(){lstn=false;var b=document.getElementById("vbtn");b.classList.remove("listening");b.textContent="🎤";document.getElementById("ui").placeholder="Ask me any education question, project idea, or roadmap…";if(document.getElementById("ui").value.trim())send();};
  rec.onerror=function(){lstn=false;document.getElementById("vbtn").classList.remove("listening");document.getElementById("vbtn").textContent="🎤";};
  rec.start();
}
</script>
