<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BrainStack AI Assistant</title>
<style>
:root {
  --brand-blue:   #2563EB;
  --brand-purple: #7C3AED;
  --brand-green:  #10B981;
  --brand-red:    #EF4444;
  --text-dark:    #0F172A;
  --text-mid:     #334155;
  --text-muted:   #94A3B8;
  --bg-page:      #F1F5F9;
  --bg-white:     #FFFFFF;
  --bg-code:      #1E293B;
  --border:       #E2E8F0;
  --blue-tint:    #EFF6FF;
  --blue-light:   #DBEAFE;
  --font-main:    'Inter', sans-serif;
  --font-mono:    'JetBrains Mono', monospace;
}
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
button { font-family: var(--font-main); cursor:pointer; }
a { text-decoration:none; }
body {
  font-family: var(--font-main);
  background: var(--bg-page);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* HEADER */
#header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 18px;
  background: var(--bg-white);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.logo { display:flex; align-items:center; gap:8px; font-weight:700; font-size:16px; color:var(--brand-blue); }
.logo-icon { width:32px; height:32px; background:linear-gradient(135deg,var(--brand-blue),var(--brand-purple)); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:16px; }
.badge { background:linear-gradient(135deg,var(--brand-blue),var(--brand-purple)); color:#fff; font-size:10px; font-weight:700; padding:2px 8px; border-radius:20px; letter-spacing:.5px; }
#header-right { margin-left:auto; display:flex; align-items:center; gap:8px; }
.status-dot { width:8px; height:8px; background:var(--brand-green); border-radius:50%; animation:blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.3;} }
.status-text { font-size:12px; color:var(--brand-green); font-weight:600; }
.icon-btn { width:32px; height:32px; border:1.5px solid var(--border); border-radius:50%; background:var(--bg-white); display:flex; align-items:center; justify-content:center; font-size:14px; transition:background .15s,border-color .15s; }
.icon-btn:hover { background:var(--blue-tint); border-color:var(--brand-blue); }
.icon-btn.listening { background:var(--brand-red); border-color:var(--brand-red); }

/* PILLS BAR */
#pills-bar { flex-shrink:0; display:flex; align-items:center; gap:7px; padding:9px 18px; background:var(--bg-white); border-bottom:1px solid var(--border); overflow-x:auto; scrollbar-width:none; }
#pills-bar::-webkit-scrollbar { display:none; }
.pills-label { font-size:11px; font-weight:600; color:var(--text-muted); white-space:nowrap; margin-right:2px; }
.pill { flex-shrink:0; background:var(--blue-tint); color:var(--brand-blue); border:1px solid var(--blue-light); border-radius:20px; padding:4px 11px; font-size:11px; font-weight:500; white-space:nowrap; transition:background .15s,color .15s; }
.pill:hover { background:var(--brand-blue); color:#fff; }

/* CHAT */
#chat { flex:1; overflow-y:auto; padding:20px 16px; display:flex; flex-direction:column; gap:16px; max-width:800px; width:100%; margin:0 auto; scrollbar-width:thin; scrollbar-color:var(--border) transparent; }

/* WELCOME */
#welcome { text-align:center; padding:24px 12px; }
#welcome .big-icon { font-size:48px; margin-bottom:10px; }
#welcome h2 { font-size:20px; font-weight:700; color:var(--text-dark); margin-bottom:6px; }
#welcome p { font-size:13px; color:var(--text-muted); line-height:1.6; margin-bottom:18px; max-width:360px; margin-left:auto; margin-right:auto; }
.quick-grid { display:grid; grid-template-columns:1fr 1fr; gap:9px; max-width:460px; margin:0 auto; }
.quick-btn { background:var(--bg-white); border:1.5px solid var(--border); border-radius:12px; padding:11px 12px; font-size:12px; color:var(--text-mid); text-align:left; line-height:1.45; transition:border-color .15s,background .15s,color .15s; }
.quick-btn .qi { font-size:18px; display:block; margin-bottom:4px; }
.quick-btn:hover { border-color:var(--brand-blue); background:var(--blue-tint); color:var(--brand-blue); }

/* MESSAGES */
.msg { display:flex; gap:9px; animation:rise .25s ease; }
@keyframes rise { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
.msg.user { flex-direction:row-reverse; }
.avatar { width:32px; height:32px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0; align-self:flex-start; }
.avatar.ai { background:linear-gradient(135deg,var(--brand-blue),var(--brand-purple)); }
.avatar.user { background:var(--text-dark); }
.msg-right { display:flex; flex-direction:column; max-width:78%; }
.msg.user .msg-right { align-items:flex-end; }
.bubble { padding:12px 14px; border-radius:16px; font-size:13.5px; line-height:1.75; }
.msg.ai .bubble { background:var(--bg-white); color:var(--text-dark); border:1px solid var(--border); border-top-left-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.05); }
.msg.user .bubble { background:var(--brand-blue); color:#fff; border-top-right-radius:4px; }
.timestamp { font-size:10px; color:var(--text-muted); margin-top:3px; padding:0 2px; }

/* TYPING */
.typing { display:flex; gap:5px; align-items:center; padding:12px 14px; }
.typing span { width:7px; height:7px; background:var(--text-muted); border-radius:50%; animation:dot 1.2s infinite; }
.typing span:nth-child(2){ animation-delay:.2s; }
.typing span:nth-child(3){ animation-delay:.4s; }
@keyframes dot { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-5px);} }

/* BUBBLE CONTENT */
.bubble h3 { font-size:14px; font-weight:700; margin:10px 0 5px; }
.bubble h4 { font-size:13px; font-weight:600; margin:8px 0 4px; color:var(--text-mid); }
.bubble strong { font-weight:600; }
.bubble ul, .bubble ol { padding-left:18px; margin:5px 0; }
.bubble li { margin:3px 0; }
.bubble hr { border:none; border-top:1px solid var(--border); margin:10px 0; }
.bubble code { font-family:var(--font-mono); font-size:12px; background:#F1F5F9; color:var(--brand-purple); padding:2px 5px; border-radius:4px; }
.bubble pre { position:relative; background:var(--bg-code); color:#E2E8F0; font-family:var(--font-mono); font-size:12px; padding:14px; border-radius:8px; overflow-x:auto; margin:10px 0; line-height:1.6; }
.bubble pre code { background:none; color:inherit; padding:0; }
.copy-btn { position:absolute; top:8px; right:8px; background:#334155; color:#94A3B8; border:none; font-size:10px; padding:3px 8px; border-radius:5px; font-family:var(--font-main); }
.copy-btn:hover { background:#475569; color:#fff; }

/* RESOURCE CARDS */
.res-card { display:flex; align-items:center; gap:10px; border-radius:8px; padding:10px 12px; margin-top:9px; border:1px solid; transition:opacity .2s; }
.res-card:hover { opacity:.85; }
.res-card.pdf { background:var(--blue-tint); border-color:var(--blue-light); }
.res-card.roadmap { background:#F0FDF4; border-color:#BBF7D0; }
.res-icon { font-size:18px; flex-shrink:0; }
.res-info { flex:1; }
.res-title { font-size:12px; font-weight:600; }
.res-card.pdf .res-title { color:var(--brand-blue); }
.res-card.roadmap .res-title { color:var(--brand-green); }
.res-sub { font-size:11px; color:var(--text-muted); margin-top:1px; }
.res-arrow { font-size:14px; font-weight:700; color:var(--text-muted); }

/* CHIPS */
.chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.chip { background:var(--blue-tint); border:1px solid var(--blue-light); color:var(--brand-blue); font-size:11px; padding:4px 10px; border-radius:20px; transition:background .15s,color .15s; }
.chip:hover { background:var(--brand-blue); color:#fff; }

/* INPUT */
#input-area { flex-shrink:0; background:var(--bg-white); border-top:1px solid var(--border); padding:12px 16px; }
#input-wrap { max-width:800px; margin:0 auto; display:flex; align-items:flex-end; gap:8px; background:#F8FAFF; border:1.5px solid var(--border); border-radius:16px; padding:8px 8px 8px 14px; transition:border-color .2s; }
#input-wrap:focus-within { border-color:var(--brand-blue); }
#user-input { flex:1; border:none; background:transparent; font-family:var(--font-main); font-size:13.5px; color:var(--text-dark); resize:none; outline:none; max-height:100px; min-height:22px; line-height:1.5; }
#user-input::placeholder { color:var(--text-muted); }
#send-btn { width:36px; height:36px; background:var(--brand-blue); border:none; border-radius:10px; color:#fff; font-size:15px; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s,transform .15s; }
#send-btn:hover { background:#1D4ED8; transform:scale(1.05); }
#send-btn:disabled { background:var(--border); transform:none; cursor:default; }
#input-hint { text-align:center; font-size:10.5px; color:var(--text-muted); margin-top:6px; }

@media(max-width:500px) {
  .quick-grid { grid-template-columns:1fr; }
  .msg-right { max-width:88%; }
  #chat { padding:14px 12px; }
  #header { padding:10px 12px; }
}
</style>

/* ============================================================
   INTENT DETECTION
============================================================ */
function detectIntent(text) {
  const t = text.toLowerCase();
  if (/^(hi|hello|hey|hii|good morning|good evening|good afternoon|namaste)\b/.test(t.trim())) return "greeting";
  if (/(who (made|created|built)|about brainstack|founder|rehan|what is brainstack)/.test(t))  return "about";
  if (/(thank|thanks|great job|awesome|well done|helpful|love it)/.test(t))                    return "thanks";
  if (/(bye|goodbye|see you|later)/.test(t))                                                   return "bye";
  if (/(roadmap|how to become|learning path|step.?by.?step)/.test(t))                          return "roadmap";
  return "educate";
}

function matchResources(query) {
  const q = query.toLowerCase();
  return RESOURCES
    .map(r => ({ ...r, score: r.keywords.filter(k => q.includes(k)).length }))
    .filter(r => r.score > 0)
    .sort((a, b) => b.score - a.score)
    .slice(0, 2);
}

function matchRoadmap(query) {
  const q = query.toLowerCase();
  return ROADMAPS.find(r => r.keywords.some(k => q.includes(k))) || null;
}

  if (intent === "greeting") return { text:`${g}! 👋 I'm BrainStack AI — your personal education guide. Ask me about any subject, get project code, or explore a roadmap. What would you like to study today?`, chips:["Give me a roadmap","I want a project","Explain a subject","About BrainStack"] };
  if (intent === "about")    return { text:`**BrainStack** is a free learning platform for engineering and science students 🧠\n\n**👨‍💻 Created by:** Shaik Mohammed Rehan\n**🎯 Mission:** Free quality education for every student\n\n**6 Categories:**\n- Engineering Hub\n- Bachelor of Science\n- Programming\n- Web Development\n- Artificial Intelligence\n- BrainStack Library\n\n**🌐** brainstack-com.vercel.app`, chips:["Show me resources","Give me a project","Learning roadmap"] };
  if (intent === "thanks")   return { text:["You're welcome! 😊 Keep studying — you're doing great! What's next?","Happy to help! 🎉 What else do you want to learn?","Glad that helped! 🚀 Want a project or roadmap next?"][Math.floor(Math.random()*3)], chips:[] };
  if (intent === "bye")      return { text:"Goodbye! 👋 Keep learning and building. BrainStack AI is always here. Good luck! 🎓", chips:[] };
  return null;
}

/* ============================================================
   SEND MESSAGE
   ➜ Calls /api/chat (our safe serverless function)
      which talks to Gemini using the hidden API key
============================================================ */
async function sendMessage() {
  const input = document.getElementById("user-input");
  const text  = input.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  document.getElementById("send-btn").disabled = true;
  input.value = "";
  input.style.height = "auto";

  addMessage("user", text);

  const intent = detectIntent(text);
  const local  = localResponse(intent);

  if (local) {
    showTyping();
    await delay(500);
    removeTyping();
    addMessage("ai", local.text, { chips: local.chips });
  } else {
    apiHistory.push({ role:"user", content: text });
    showTyping();
    try {
      // ➜ Calls our safe serverless function — NO API KEY IN FRONTEND
      const res  = await fetch("/api/chat", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          messages:     apiHistory,
          systemPrompt: buildSystemPrompt()
        })
      });
      const data  = await res.json();
      const reply = data.reply || "Sorry, I didn't get a response. Please try again!";
      removeTyping();
      addMessage("ai", reply, {
        pdfs:    matchResources(text),
        roadmap: intent === "roadmap" ? matchRoadmap(text) : null
      });
      apiHistory.push({ role:"assistant", content: reply });
    } catch (err) {
      removeTyping();
      addMessage("ai", "⚠️ Connection issue! Please check your internet and try again.");
      apiHistory.pop();
    }
  }

  isLoading = false;
  document.getElementById("send-btn").disabled = false;
  input.focus();
}

/* ============================================================
   UI HELPERS
============================================================ */
function addMessage(role, text, extras) {
  extras = extras || {};
  var welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();
  var chat = document.getElementById("chat");
  var row  = document.createElement("div"); row.className = "msg " + role;
  var av   = document.createElement("div"); av.className = "avatar " + role; av.textContent = role==="ai"?"🧠":"👤";
  var right= document.createElement("div"); right.className = "msg-right";
  var bubble=document.createElement("div"); bubble.className = "bubble";

  if (role === "ai") {
    bubble.innerHTML = fmt(text);
    (extras.pdfs||[]).forEach(function(p){
      var c=document.createElement("a"); c.className="res-card pdf"; c.href=p.url; c.target="_blank";
      c.innerHTML='<span class="res-icon">'+p.emoji+' 📄</span><div class="res-info"><div class="res-title">'+p.name+'</div><div class="res-sub">'+p.category+' · Open on BrainStack</div></div><span class="res-arrow">→</span>';
      bubble.appendChild(c);
    });
    if (extras.roadmap) {
      var r=document.createElement("a"); r.className="res-card roadmap"; r.href=extras.roadmap.url; r.target="_blank";
      r.innerHTML='<span class="res-icon">'+extras.roadmap.emoji+'</span><div class="res-info"><div class="res-title">'+extras.roadmap.name+'</div><div class="res-sub">View full roadmap →</div></div><span class="res-arrow">→</span>';
      bubble.appendChild(r);
    }
    if (extras.chips && extras.chips.length) {
      var cw=document.createElement("div"); cw.className="chips";
      extras.chips.forEach(function(q){ var c=document.createElement("button"); c.className="chip"; c.textContent=q; c.onclick=function(){ask(q);}; cw.appendChild(c); });
      bubble.appendChild(cw);
    }
  } else { bubble.textContent = text; }

  var ts=document.createElement("div"); ts.className="timestamp"; ts.textContent=new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
  right.appendChild(bubble); right.appendChild(ts);
  row.appendChild(av); row.appendChild(right);
  chat.appendChild(row); chat.scrollTop=chat.scrollHeight;
}

function fmt(t) {
  return t
    .replace(/```(\w+)?\n?([\s\S]*?)```/g,function(_,l,c){var e=c.trim().replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");return'<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>'+e+'</code></pre>';})
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/^### (.+)$/gm,'<h3>$1</h3>')
    .replace(/^#### (.+)$/gm,'<h4>$1</h4>')
    .replace(/^[-•] (.+)$/gm,'<li>$1</li>')
    .replace(/^\d+\. (.+)$/gm,'<li>$1</li>')
    .replace(/\n\n/g,'<br><br>').replace(/\n/g,'<br>');
}
function copyCode(btn){navigator.clipboard.writeText(btn.nextElementSibling.textContent).then(function(){btn.textContent="Copied!";setTimeout(function(){btn.textContent="Copy";},2000);});}
function showTyping(){var chat=document.getElementById("chat"),row=document.createElement("div");row.id="typing-row";row.className="msg ai";row.innerHTML='<div class="avatar ai">🧠</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';chat.appendChild(row);chat.scrollTop=chat.scrollHeight;}
function removeTyping(){var el=document.getElementById("typing-row");if(el)el.remove();}
function delay(ms){return new Promise(function(r){setTimeout(r,ms);});}
function ask(t){document.getElementById("user-input").value=t;sendMessage();}
function onKey(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}}
function resize(el){el.style.height="auto";el.style.height=Math.min(el.scrollHeight,100)+"px";}
function clearChat(){if(!confirm("Clear the chat?"))return;document.getElementById("chat").innerHTML='<div id="welcome" style="text-align:center;padding:24px 12px"><div style="font-size:48px;margin-bottom:10px">🧠</div><h2 style="font-size:20px;font-weight:700;color:#0F172A;margin-bottom:6px">BrainStack AI</h2><p style="font-size:13px;color:#94A3B8">Chat cleared! What would you like to study?</p></div>';apiHistory=[];}

/* VOICE */
var recognition=null,listening=false;
function toggleVoice(){
  if(!("webkitSpeechRecognition" in window||"SpeechRecognition" in window)){alert("Voice works in Chrome! Please use Chrome.");return;}
  if(listening){recognition.stop();return;}
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR(); recognition.lang="en-US"; recognition.continuous=false; recognition.interimResults=false;
  recognition.onstart=function(){listening=true;var b=document.getElementById("voice-btn");b.classList.add("listening");b.textContent="🔴";document.getElementById("user-input").placeholder="Listening… speak now";};
  recognition.onresult=function(e){document.getElementById("user-input").value=e.results[0][0].transcript;};
  recognition.onend=function(){listening=false;var b=document.getElementById("voice-btn");b.classList.remove("listening");b.textContent="🎤";document.getElementById("user-input").placeholder="Ask me any education question, project idea, or roadmap…";if(document.getElementById("user-input").value.trim())sendMessage();};
  recognition.onerror=function(){listening=false;document.getElementById("voice-btn").classList.remove("listening");document.getElementById("voice-btn").textContent="🎤";};
  recognition.start();
}
</script>
