<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainStack Profile</title>
  <link rel="icon" type="image/png" href="brainstack.png">
<style>

  /* -------------------------
   VARIABLES
------------------------- */

:root{

--primary:#16a34a;
--primary-dark:#15803d;
--primary-light:#22c55e;

--secondary:#f0fdf4;

--background:#ffffff;
--surface:#f8fafc;

--text:#0f172a;
--text-light:#64748b;

--border:#e2e8f0;

--shadow-sm:0 4px 14px rgba(15,23,42,.05);
--shadow:0 12px 35px rgba(15,23,42,.08);
--shadow-lg:0 20px 60px rgba(15,23,42,.12);

--radius:18px;
--radius-lg:28px;

--transition:.30s ease;

}

/* -------------------------
   RESET
------------------------- */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:linear-gradient(180deg,#ffffff,#f8fafc);

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

    color:var(--text);

}

/* -------------------------
   PROFILE CARD
------------------------- */

.profile-card{

    width:100%;
    max-width:460px;

    background:var(--background);

    border-radius:var(--radius-lg);

    padding:40px;

    text-align:center;

    border:1px solid var(--border);

    box-shadow:var(--shadow);

}

/* -------------------------
   PROFILE IMAGE
------------------------- */

.profile-img{

    width:120px;

    height:120px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid var(--primary);

    padding:4px;

    background:#fff;

    margin-bottom:20px;

    box-shadow:0 10px 25px rgba(22,163,74,.18);

}

/* -------------------------
   NAME
------------------------- */

#fullName{

    margin-bottom:25px;

    color:var(--primary-dark);

    font-size:1.7rem;

    font-weight:700;

}

/* -------------------------
   INFO BOXES
------------------------- */

.info-box{

    background:var(--surface);

    padding:15px 18px;

    border:1px solid var(--border);

    border-radius:14px;

    margin-bottom:14px;

    text-align:left;

    transition:var(--transition);

}

.info-box:hover{

    border-color:var(--primary-light);

    background:var(--secondary);

}

.info-box strong{

    color:var(--text);

}

.info-box span{

    float:right;

    color:var(--text-light);

    font-weight:500;

}

/* -------------------------
   DASHBOARD
------------------------- */

.dashboard{

    display:flex;

    flex-direction:column;

    gap:16px;

    margin:30px 0;

}

.dashboard-item{

    background:var(--surface);

    border:1px solid var(--border);

    padding:16px;

    border-radius:14px;

    text-align:left;

    font-weight:600;

    color:var(--text);

    cursor:pointer;

    transition:var(--transition);

}

.dashboard-item:hover{

    background:var(--secondary);

    border-color:var(--primary);

    color:var(--primary-dark);

    transform:translateY(-2px);

}

/* -------------------------
   LOGOUT BUTTON
------------------------- */

.logout-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    background:var(--primary);

    color:#fff;

    font-size:16px;

    font-weight:600;

    cursor:pointer;

    transition:var(--transition);

}

.logout-btn:hover{

    background:var(--primary-dark);

    transform:translateY(-2px);

}

/* -------------------------
   MOBILE
------------------------- */

@media(max-width:600px){

.profile-card{

    padding:28px;

}

.profile-img{

    width:100px;

    height:100px;

}

#fullName{

    font-size:1.45rem;

}

.info-box{

    font-size:14px;

}

}

</style>

  <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C3J27V16D2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-C3J27V16D2');
</script>


</head>

<body>

<div class="profile-card">

    <img
id="profilePhoto"
class="profile-img"
src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h2 id="fullName">Loading...</h2>

<div class="info-box">
    <strong>Email:</strong>
    <span id="email">Loading...</span>
</div>

<div class="info-box">
    <strong>Gender:</strong>
    <span id="gender">-</span>
</div>

<div class="info-box">
    <strong>College:</strong>
    <span id="college">-</span>
</div>

<div class="info-box">
    <strong>Branch:</strong>
    <span id="branch">-</span>
</div>

<div class="info-box">
    <strong>Semester:</strong>
    <span id="semester">-</span>
</div>

<div class="info-box">
    <strong>Joined:</strong>
    <span id="joinedDate">-</span>
</div>

<div class="dashboard">


<a href="editprofile.html"
style="text-decoration:none;color:inherit;">

<div class="dashboard-item">
 Edit Profile
</div>

</a>
    
</div>

<button
class="logout-btn"
onclick="logoutUser()">
    Logout
</button>
</div>

 <script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://waeeeyktjujpvpcprhbv.supabase.co",
"sb_publishable_4HE-L3GRIkDq4wSIaxWyJw_vtngeHdj"
);

     const {
  data: { session }
} = await supabase.auth.getSession();
if (!session) {

    window.location.href = "login.html";

} else {

    const user = session.user;

    const { data: profile, error } = await supabase
    .from("profiles")
    .select("*")
    .eq("id", user.id)
    .maybeSingle();

    console.log("PROFILE:", profile);
    console.log("ERROR:", error);

    document.getElementById("email").textContent =
    profile?.email || user.email;

    document.getElementById("fullName").textContent =
    profile?.full_name || "BrainStack User";

    document.getElementById("gender").textContent =
    profile?.gender || "-";

    document.getElementById("college").textContent =
    profile?.college || "-";

    document.getElementById("branch").textContent =
    profile?.branch || "-";

    document.getElementById("semester").textContent =
    profile?.semester || "-";

    document.getElementById("joinedDate").textContent =
    profile?.created_at
    ? new Date(profile.created_at).toLocaleDateString()
    : "-";

    document.getElementById("profilePhoto").src =
    profile?.avatar_url ||
    "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
}

window.logoutUser = async () => {

    await supabase.auth.signOut();

    window.location.href = "login.html";
};

    
</script>

    
</body>
</html>
