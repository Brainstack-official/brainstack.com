<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainStack Profile</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:#F9FAFB;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.profile-card{
  width:100%;
  max-width:450px;
  background:white;
  border-radius:20px;
  padding:40px;
  text-align:center;
  border:1px solid #E5E7EB;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.profile-photo{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #111827;
  margin-bottom:20px;
}

h1{
  color:#111827;
  margin-bottom:25px;
}

.info{
  text-align:left;
  margin-top:20px;
}

.info p{
  margin:12px 0;
  color:#374151;
  font-size:16px;
}

.btn{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
  margin-top:15px;
}

.logout-btn{
  background:#111827;
  color:white;
}

.delete-btn{
  background:#DC2626;
  color:white;
}

</style>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
  "https://waeeeyktjujpvpcprhbv.supabase.co",
  "YOUR_PUBLISHABLE_KEY"
);

const {
  data:{session}
} = await supabase.auth.getSession();

if(!session){
  window.location.href="login.html";
}

window.sessionData = session;
window.supabase = supabase;

</script>

</head>

<body>

<div class="profile-card">

<img
id="photo"
class="profile-photo"
src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

<h1>My Profile</h1>

<div class="info">

<p>
<strong>Name:</strong>
<span id="name">Loading...</span>
</p>

<p>
<strong>Email:</strong>
<span id="email">Loading...</span>
</p>

<p>
<strong>Provider:</strong>
<span id="provider">Loading...</span>
</p>

</div>

<button class="btn logout-btn" id="logoutBtn">
Logout
</button>

<button class="btn delete-btn">
Delete Account
</button>

</div>

<script type="module">

const session = window.sessionData;

const user = session.user;

document.getElementById("name").innerText =
user.user_metadata.full_name ||
user.user_metadata.name ||
"BrainStack User";

document.getElementById("email").innerText =
user.email;

document.getElementById("provider").innerText =
user.app_metadata.provider;

if(user.user_metadata.avatar_url){

document.getElementById("photo").src =
user.user_metadata.avatar_url;

}

document.getElementById("logoutBtn")
.addEventListener("click", async()=>{

await window.supabase.auth.signOut();

window.location.href="login.html";

});

</script>

</body>
</html>
