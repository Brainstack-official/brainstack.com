<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile</title>
  <link rel="icon" type="image/png" href="brainstack.png">
<style>

:root{

--primary:#16a34a;
--primary-dark:#15803d;
--primary-light:#22c55e;

--secondary:#f0fdf4;

--background:#ffffff;
--surface:#f8fafc;

--text:#0f172a;
--text-light:#64748b;

--border:#e2e8f0;

--shadow-sm:0 4px 14px rgba(15,23,42,.05);
--shadow:0 12px 35px rgba(15,23,42,.08);
--shadow-lg:0 20px 60px rgba(15,23,42,.12);

--radius:18px;
--radius-lg:28px;

--transition:.30s ease;

}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:var(--surface);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
color:var(--text);
}

.container{

width:100%;
max-width:500px;

background:var(--background);

padding:40px;

border-radius:var(--radius-lg);

border:1px solid var(--border);

box-shadow:var(--shadow);

transition:var(--transition);

}

.container:hover{
transform:translateY(-3px);
box-shadow:var(--shadow-lg);
}

h2{

text-align:center;

margin-bottom:30px;

font-size:2rem;

font-weight:700;

color:var(--primary-dark);

}

input,
select{

width:100%;

padding:15px 16px;

margin-bottom:18px;

border:1px solid var(--border);

border-radius:14px;

font-size:15px;

background:var(--background);

color:var(--text);

transition:var(--transition);

outline:none;

}

input::placeholder{
color:var(--text-light);
}

input:focus,
select:focus{

border-color:var(--primary);

box-shadow:0 0 0 4px rgba(22,163,74,.12);

}

button{

width:100%;

padding:15px;

border:none;

border-radius:14px;

background:linear-gradient(135deg,var(--primary),var(--primary-dark));

color:white;

font-size:16px;

font-weight:600;

cursor:pointer;

transition:var(--transition);

box-shadow:0 8px 20px rgba(22,163,74,.25);

}

button:hover{

transform:translateY(-2px);

box-shadow:0 14px 28px rgba(22,163,74,.35);

}

button:active{
transform:scale(.98);
}

#message{

margin-top:18px;

text-align:center;

font-weight:600;

font-size:15px;

color:var(--primary-dark);

}

@media(max-width:600px){

.container{

padding:28px;

border-radius:22px;

}

h2{

font-size:1.7rem;

margin-bottom:24px;

}

input,
select,
button{

padding:14px;

font-size:15px;

}

}
</style>

  
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C3J27V16D2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-C3J27V16D2');
</script>


  
</head>
<body>

<div class="container">

<h2>Edit Profile</h2>

<input type="text" id="fullName" placeholder="Full Name">

<select id="gender">
<option value="">Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>
</select>

<input type="text" id="college" placeholder="College Name">

<input type="text" id="branch" placeholder="Branch">

<input type="text" id="semester" placeholder="Semester">

<input type="text"
id="avatar"
placeholder="Profile Photo URL (optional)">

<button id="saveBtn">
Save Profile
</button>

<p id="message"></p>

</div>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://waeeeyktjujpvpcprhbv.supabase.co",
"sb_publishable_4HE-L3GRIkDq4wSIaxWyJw_vtngeHdj"
);

const {
data:{session}
} = await supabase.auth.getSession();

if(!session){

window.location.href="login.html";

}

const user = session.user;

const { data } = await supabase
.from("profiles")
.select("*")
.eq("id",user.id)
.single();

if(data){

document.getElementById("fullName").value =
data.full_name || "";

document.getElementById("gender").value =
data.gender || "";

document.getElementById("college").value =
data.college || "";

document.getElementById("branch").value =
data.branch || "";

document.getElementById("semester").value =
data.semester || "";

document.getElementById("avatar").value =
data.avatar_url || "";

}

document.getElementById("saveBtn")
.addEventListener("click",async()=>{

const profileData = {

id:user.id,
email:user.email,

full_name:
document.getElementById("fullName").value,

gender:
document.getElementById("gender").value,

college:
document.getElementById("college").value,

branch:
document.getElementById("branch").value,

semester:
document.getElementById("semester").value,

avatar_url:
document.getElementById("avatar").value

};

const { error } = await supabase
.from("profiles")
.upsert(profileData);

if(error){

document.getElementById("message").innerText =
error.message;

}else{

document.getElementById("message").innerText =
"Profile Updated Successfully";

setTimeout(()=>{

window.location.href =
"profile.html";

},1000);

}

});

</script>

</body>
</html>
