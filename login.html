<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BrainStack Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#F9FAFB;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{

    width:100%;
    max-width:420px;

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.08);

    border:1px solid #E5E7EB;
}

.logo{

    text-align:center;

    font-size:2rem;

    font-weight:700;

    color:#111827;

    margin-bottom:10px;
}

.subtitle{

    text-align:center;

    color:#6B7280;

    margin-bottom:30px;
}

input{

    width:100%;

    padding:15px;

    margin-bottom:15px;

    border:1px solid #D1D5DB;

    border-radius:12px;

    outline:none;

    font-size:15px;
}

input:focus{
    border-color:#111827;
}

.btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    margin-bottom:12px;

    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.login-btn{
    background:#111827;
    color:white;
}

.signup-btn{
    background:#374151;
    color:white;
}

.google-btn{
    background:white;
    color:#111827;
    border:1px solid #D1D5DB;
}

.divider{

    text-align:center;

    margin:20px 0;

    color:#6B7280;
}

#message{

    text-align:center;

    margin-top:15px;

    color:#111827;

    font-size:14px;
}

@media(max-width:600px){

    .container{
        padding:25px;
    }

    .logo{
        font-size:1.8rem;
    }

}

</style>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

window.supabase = createClient(
"https://waeeeyktjujpvpcprhbv.supabase.co",
"sb_publishable_4HE-L3GRIkDq4wSIaxWyJw_vtngeHdj"
);

</script>

</head>

<body>

<div class="container">

    <div class="logo">
        BrainStack
    </div>

    <p class="subtitle">
        Login or Create Account
    </p>

    <input
    type="email"
    id="email"
    placeholder="Enter your email">

    <input
    type="password"
    id="password"
    placeholder="Enter your password">

    <button
    class="btn login-btn"
    id="loginBtn">
        Login
    </button>

    <div class="divider">
        OR
    </div>

    <button
    class="btn google-btn"
    id="googleBtn">
        Continue with Google
    </button>

    <p id="message"></p>

</div>

<script type="module">

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const message =
document.getElementById("message");

document.getElementById("signupBtn")
.addEventListener("click", async () => {

    const { error } =
    await window.supabase.auth.signUp({

        email: email.value,
        password: password.value

    });

    if(error){

        message.innerText =
        error.message;

    }else{

        message.innerText =
        "Account created successfully. Check your email.";

    }

});

document.getElementById("loginBtn")
.addEventListener("click", async () => {

    const { error } =
    await window.supabase.auth.signInWithPassword({

        email: email.value,
        password: password.value

    });

    if(error){

        message.innerText =
        error.message;

    }else{

        window.location.href =
        "index.html";

    }

});

document.getElementById("googleBtn")
.addEventListener("click", async () => {

    await window.supabase.auth.signInWithOAuth({

        provider:"google",

        options:{

            redirectTo:
            "https://brainstack-official.github.io/brainstack.com/index.html"

        }

    });

});

</script>

</body>
</html>
