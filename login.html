<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="BrainStack provides engineering notes, programming resources, AI learning materials and career guidance for students.">

<meta name="keywords"
content="engineering notes, mechanical engineering, programming, AI resources, student resources">

<meta name="author"
content="BrainStack">
  

<title>BrainStack Login</title>
  <link rel="icon" type="image/png" href="brainstack.png">
<style>

/* -------------------------
   VARIABLES
------------------------- */

:root{

--primary:#16a34a;
--primary-dark:#15803d;
--primary-light:#22c55e;

--secondary:#f0fdf4;

--background:#ffffff;
--surface:#f8fafc;

--text:#0f172a;
--text-light:#64748b;

--border:#e2e8f0;

--shadow-sm:0 4px 14px rgba(15,23,42,.05);
--shadow:0 12px 35px rgba(15,23,42,.08);
--shadow-lg:0 20px 60px rgba(15,23,42,.12);

--radius:18px;
--radius-lg:28px;

--transition:.30s ease;

}

/* -------------------------
   RESET
------------------------- */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:'Poppins',sans-serif;

    background:linear-gradient(180deg,#ffffff,#f8fafc);

    min-height:100vh;

    color:var(--text);

    padding:20px;

}

/* -------------------------
   LOGIN
------------------------- */

.login-wrapper{

    min-height:85vh;

    display:flex;

    justify-content:center;

    align-items:center;

}

.container{

    width:100%;
    max-width:430px;

    background:var(--background);

    padding:42px;

    border-radius:var(--radius-lg);

    border:1px solid var(--border);

    box-shadow:var(--shadow);

}

.logo{

    text-align:center;

    font-size:1.8rem;

    font-weight:700;

    line-height:1.35;

    color:var(--primary-dark);

    margin-bottom:12px;

}

.subtitle{

    text-align:center;

    color:var(--text-light);

    margin-bottom:32px;

    line-height:1.6;

}

/* -------------------------
   INPUTS
------------------------- */

input{

    width:100%;

    padding:15px 18px;

    margin-bottom:18px;

    border:1px solid var(--border);

    border-radius:14px;

    background:var(--surface);

    font-size:15px;

    color:var(--text);

    transition:var(--transition);

}

input::placeholder{

    color:var(--text-light);

}

input:focus{

    outline:none;

    border-color:var(--primary);

    background:#fff;

    box-shadow:0 0 0 4px rgba(34,197,94,.15);

}

/* -------------------------
   BUTTONS
------------------------- */

.btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    margin-bottom:14px;

    transition:var(--transition);

}

.btn:hover{

    transform:translateY(-2px);

}

/* Login */

.login-btn{

    background:var(--primary);

    color:#fff;

}

.login-btn:hover{

    background:var(--primary-dark);

}

/* Signup */

.signup-btn{

    background:var(--primary-light);

    color:#fff;

}

.signup-btn:hover{

    background:var(--primary);

}

/* Google */

.google-btn{

    background:#fff;

    color:var(--text);

    border:1px solid var(--border);

}

.google-btn:hover{

    border-color:var(--primary);

    background:var(--secondary);

}

/* -------------------------
   DIVIDER
------------------------- */

.divider{

    text-align:center;

    margin:22px 0;

    color:var(--text-light);

    font-weight:500;

}

/* -------------------------
   MESSAGE
------------------------- */

#message{

    text-align:center;

    margin-top:16px;

    color:var(--primary-dark);

    font-size:14px;

    font-weight:500;

}

/* -------------------------
   FOOTER
------------------------- */

#footer{

    width:100%;

    background:#0f172a;

    padding:35px 20px;

    text-align:center;

    margin-top:40px;

}

.footer-links{

    display:flex;

    justify-content:center;

    flex-wrap:wrap;

    gap:22px;

    margin-bottom:18px;

}

.footer-links a{

    color:#fff;

    text-decoration:none;

    font-size:16px;

    font-weight:500;

    transition:var(--transition);

}

.footer-links a:hover{

    color:var(--primary-light);

}

#footer p{

    color:#cbd5e1;

    font-size:15px;

}

/* -------------------------
   MOBILE
------------------------- */

@media(max-width:600px){

.container{

    padding:28px;

}

.logo{

    font-size:1.55rem;

}

.subtitle{

    font-size:.95rem;

}

.footer-links{

    gap:12px;

}

.footer-links a{

    font-size:13px;

}

#footer p{

    font-size:13px;

}

}

</style>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

window.supabase = createClient(
"https://waeeeyktjujpvpcprhbv.supabase.co",
"sb_publishable_4HE-L3GRIkDq4wSIaxWyJw_vtngeHdj"
);

</script>

  
  <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C3J27V16D2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-C3J27V16D2');
</script>


</head>

<body>
  <div class="login-wrapper">

<div class="container">

    <div class="logo">
        BrainStack Students Resource Platform
    </div>

    <p class="subtitle">
        Login or Create Account to Access Free Resources
    </p>

    <input
    type="email"
    id="email"
    placeholder="Enter your email">

    <input
    type="password"
    id="password"
    placeholder="Enter your password">

    <button
    class="btn login-btn"
    id="loginBtn">
        Login
    </button>

    <button
    class="btn signup-btn"
    id="signupBtn">
        Sign Up
    </button>

    <div class="divider">
        OR
    </div>

    <button
    class="btn google-btn"
    id="googleBtn">
        Continue with Google
    </button>

    <p id="message"></p>

</div>
  </div>

  <!-- FOOTER -->
 <footer id="footer">

    <div class="footer-links">
        <a href="about.html">About Us</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms.html">Terms & Conditions</a>
        <a href="disclaimer.html">Disclaimer</a>
    </div>

    <p>© 2026 BrainStack. All Rights Reserved.</p>

</footer>
  
<script type="module">

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const message =
document.getElementById("message");

document.getElementById("signupBtn")
.addEventListener("click", async () => {

    const { error } =
    await window.supabase.auth.signUp({

        email: email.value,
        password: password.value

    });

    if(error){

        message.innerText =
        error.message;

    }else{

        message.innerText =
        "Account created successfully. Check your email.";

    }

});

document.getElementById("loginBtn")
.addEventListener("click", async () => {

    const { error } =
    await window.supabase.auth.signInWithPassword({

        email: email.value,
        password: password.value

    });

    if(error){

        message.innerText =
        error.message;

    }else{

        window.location.href =
        "index.html";

    }

});

document.getElementById("googleBtn")
.addEventListener("click", async () => {

    await window.supabase.auth.signInWithOAuth({

        provider:"google",

        options:{

            redirectTo:
           "https://brainstack-com.vercel.app/index.html"

        }

    });

});

</script>

</body>
</html>
