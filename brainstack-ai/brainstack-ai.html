<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>BrainStack AI Assistant</title>
<link rel="stylesheet" href="brainstack-ai.css">
  <link rel="icon" type="image/png" href="../logo.png">
</head>
  
<body>

<!-- ============================================================
  HEADER
============================================================ -->
<div id="header">
  <a href="https://brainstack-com.vercel.app" class="logo">
    <div class="logo-icon">🧠</div>
    BrainStack
  </a>
  <span class="badge">AI</span>
  
  <div id="header-right">
      <a href="https://brainstack-com.vercel.app" class="icon-btn">
    🏡
  </a>
    <div class="status">
      <div class="dot"></div>
      <span class="status-text">Online</span>
    </div>
    <button class="icon-btn" id="voice-btn" title="Voice input" onclick="toggleVoice()">🎤</button>
    <button class="icon-btn" title="Clear chat" onclick="clearChat()">🗑️</button>
  </div>
</div>

<!-- ============================================================
  TOPIC PILLS
  ➜ Add more topics here — just copy a <button class="pill"> line
============================================================ -->
<div id="pills-bar">
  <span class="pills-label">Topics:</span>
  <button class="pill" onclick="ask('Explain engineering hub')">⚙️ Engineering</button>
  <button class="pill" onclick="ask('Python programming guide')">🐍 Python</button>
  <button class="pill" onclick="ask('Explain machine learning')">🤖 AI & ML</button>
  <button class="pill" onclick="ask('Find library resources')">📚 Library</button>
</div>

<!-- ============================================================
  CHAT AREA
============================================================ -->
<div id="chat">

  <!-- Welcome Screen -->
  <div id="welcome">
    <h2>Hi I'm BrainStack AI</h2>
    <p>Your smart study assistant — I explain topics, give project code, show roadmaps, and find PDFs for you.</p>
    <div class="quick-grid">
      <button class="quick-btn" onclick="ask('How to become a full stack web developer roadmap')">
        <span class="qi">🌐</span>Full Stack Developer Roadmap
      </button>
      <button class="quick-btn" onclick="ask('Give me a complete HTML CSS project with code')">
        <span class="qi">💻</span>HTML & CSS project with code
      </button>
      <button class="quick-btn" onclick="ask('Explain machine learning with examples')">
        <span class="qi">🤖</span>Explain Machine Learning
      </button>
      <button class="quick-btn" onclick="ask('Explain thermodynamics for mechanical engineering')">
        <span class="qi">⚙️</span>Mechanical Engineering basics
      </button>
      <button class="quick-btn" onclick="ask('Give me a Python beginner project with code')">
        <span class="qi">🐍</span>Python beginner project
      </button>
      <button class="quick-btn" onclick="ask('What is BrainStack and who created it')">
        <span class="qi">💡</span>About BrainStack
      </button>
    </div>
  </div>

</div>

<!-- ============================================================
  INPUT BAR
============================================================ -->
<div id="input-area">
  <div id="input-wrap">
    <textarea
      id="user-input"
      rows="1"
      placeholder="Ask me anything — topics, projects, roadmaps, PDFs…"
      onkeydown="onKey(event)"
      oninput="resize(this)"
    ></textarea>
    <button id="send-btn" onclick="sendMessage()">➤</button>
  </div>
  <div id="input-hint">BrainStack AI · Education only · by BrainStack </div>
</div>

<!-- Load chatbot engine -->
<script src="chatboot.js"></script>

<script>
// ============================================================
// UI CONTROLLER — connects chatbot.js to the HTML
// ============================================================

let busy = false;

// Load knowledge base when page opens
loadDB();

// ---- SEND MESSAGE ----
async function sendMessage() {
  const input = document.getElementById('user-input');
  const text  = input.value.trim();
  if (!text || busy) return;

  busy = true;
  document.getElementById('send-btn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  // Show user message
  addMessage('user', text);

  // Show typing dots
  showTyping();

  // Small delay to feel natural
  await delay(400 + Math.random() * 300);

  // Get reply from chatbot engine
  const reply = getReply(text);

  // Remove typing, show AI reply
  removeTyping();
  addMessage('ai', reply.text, reply);

  busy = false;
  document.getElementById('send-btn').disabled = false;
  input.focus();
}

// ---- ADD MESSAGE TO CHAT ----
function addMessage(role, text, extras) {
  extras = extras || {};

  // Remove welcome screen on first message
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const chat = document.getElementById('chat');

  // Row
  const row = document.createElement('div');
  row.className = 'msg ' + role;

  // Avatar
  const av = document.createElement('div');
  av.className = 'avatar ' + role;
  av.textContent = role === 'ai' ? '🧠' : '👤';

  // Column (bubble + timestamp)
  const col = document.createElement('div');
  col.className = 'msg-col';

  // Bubble
  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if (role === 'ai') {
    bubble.innerHTML = formatText(text);

    // PDF cards
    if (extras.pdfs && extras.pdfs.length > 0) {
      extras.pdfs.forEach(function(pdf) {
        const card = document.createElement('a');
        card.className = 'pdf-card';
        card.href = pdf.url;
        card.target = '_blank';
        card.innerHTML =
          '<span class="pdf-icon">' + pdf.emoji + ' 📄</span>' +
          '<div class="pdf-info">' +
            '<div class="pdf-title">' + pdf.title + '</div>' +
            '<div class="pdf-cat">' + pdf.category + ' · Open on BrainStack</div>' +
          '</div>' +
          '<span class="pdf-arrow">→</span>';
        bubble.appendChild(card);
      });
    }

    // Roadmap card
    if (extras.roadmap) {
      const rm = document.createElement('a');
      rm.className = 'roadmap-card';
      rm.href = extras.roadmap.url;
      rm.target = '_blank';
      rm.innerHTML =
        '<span style="font-size:18px">' + extras.roadmap.emoji + '</span>' +
        '<div><div class="rm-title">' + extras.roadmap.title + ' Roadmap</div>' +
        '<div class="rm-sub">View full roadmap on BrainStack →</div></div>';
      bubble.appendChild(rm);
    }

    // Follow-up chips
    if (extras.chips && extras.chips.length > 0) {
      const chipWrap = document.createElement('div');
      chipWrap.className = 'chips';
      extras.chips.forEach(function(q) {
        const c = document.createElement('button');
        c.className = 'chip';
        c.textContent = q;
        c.onclick = function() { ask(q); };
        chipWrap.appendChild(c);
      });
      bubble.appendChild(chipWrap);
    }

  } else {
    bubble.textContent = text;
  }

  // Timestamp
  const ts = document.createElement('div');
  ts.className = 'ts';
  ts.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  col.appendChild(bubble);
  col.appendChild(ts);
  row.appendChild(av);
  row.appendChild(col);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

// ---- FORMAT AI TEXT (Markdown-like) ----
function formatText(text) {
  return text
    // code blocks
    .replace(/```(\w+)?\n?([\s\S]*?)```/g, function(_, lang, code) {
      var escaped = code.trim()
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return '<pre><button class="copy-btn" onclick="copyCode(this)">Copy</button><code>' + escaped + '</code></pre>';
    })
    // inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // bold
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    // h2
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    // h3
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    // bullet points
    .replace(/^[•\-] (.+)$/gm, '<li>$1</li>')
    // numbered list
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // line breaks
    .replace(/\n\n/g, '<br><br>')
    .replace(/\n/g, '<br>');
}

function copyCode(btn) {
  navigator.clipboard.writeText(btn.nextElementSibling.textContent).then(function() {
    btn.textContent = 'Copied!';
    setTimeout(function() { btn.textContent = 'Copy'; }, 2000);
  });
}

// ---- TYPING INDICATOR ----
function showTyping() {
  const chat = document.getElementById('chat');
  const row  = document.createElement('div');
  row.id = 'typing-row';
  row.className = 'msg ai';
  row.innerHTML =
    '<div class="avatar ai">🧠</div>' +
    '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

// ---- UTILITY ----
function delay(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

function ask(text) {
  document.getElementById('user-input').value = text;
  sendMessage();
}

function onKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function resize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

function clearChat() {
  if (!confirm('Clear the chat?')) return;
  const chat = document.getElementById('chat');
  chat.innerHTML =
    '<div id="welcome" style="text-align:center;padding:24px 12px">' +
    '<div style="font-size:48px;margin-bottom:10px">🧠</div>' +
    '<h2 style="font-size:20px;font-weight:700;color:#0F172A;margin-bottom:6px">BrainStack AI</h2>' +
    '<p style="font-size:13px;color:#94A3B8">Chat cleared! What would you like to study?</p>' +
    '</div>';
}

// ---- VOICE INPUT ----
var recognition = null, listening = false;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
    alert('Voice input works in Chrome! Please use Chrome browser.');
    return;
  }
  if (listening) { recognition.stop(); return; }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'en-US';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function() {
    listening = true;
    var btn = document.getElementById('voice-btn');
    btn.classList.add('listening');
    btn.textContent = '🔴';
    document.getElementById('user-input').placeholder = 'Listening… speak now';
  };

  recognition.onresult = function(e) {
    document.getElementById('user-input').value = e.results[0][0].transcript;
  };

  recognition.onend = function() {
    listening = false;
    var btn = document.getElementById('voice-btn');
    btn.classList.remove('listening');
    btn.textContent = '🎤';
    document.getElementById('user-input').placeholder = 'Ask me anything — topics, projects, roadmaps, PDFs…';
    if (document.getElementById('user-input').value.trim()) sendMessage();
  };

  recognition.onerror = function() {
    listening = false;
    document.getElementById('voice-btn').classList.remove('listening');
    document.getElementById('voice-btn').textContent = '🎤';
  };

  recognition.start();
}
</script>

</body>
</html>
