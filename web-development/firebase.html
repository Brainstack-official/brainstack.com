<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title> Firebase | BrainStack</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================
   RESET
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:'Poppins',sans-serif;
  background:#F9FAFB;
  color:#111827;
  overflow-x:hidden;
}


/* =========================
   NAVBAR
========================= */

.navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:20px 8%;

  background:#FFFFFF;

  border-bottom:1px solid #E5E7EB;

  z-index:1000;
}

.logo{
  font-size:1.8rem;
  font-weight:700;
}

.logo a{
  text-decoration:none;
  color:#111827;
}

.menu a{
  text-decoration:none;
  color:#111827;
  font-weight:600;
}


/* =========================
   HERO
========================= */

.hero{
  padding:160px 20px 80px;
  text-align:center;
}

.hero h1{
  font-size:4rem;
  font-weight:800;
  margin-bottom:15px;
}

.hero p{
  color:#111827;
  font-size:1.2rem;
  max-width:700px;
  margin:auto;
}


/* =========================
   RESOURCE SECTION
========================= */

.resources{
  padding:0 8% 100px;
}

.resource-grid{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(320px,1fr));

  gap:30px;
}

.card{
  background:#FFFFFF;

  border:1px solid #E5E7EB;

  border-radius:24px;

  padding:30px;

  transition:.3s ease;

  box-shadow:
  0 4px 12px rgba(0,0,0,.04);
}

.card:hover{
  transform:translateY(-5px);

  box-shadow:
  0 12px 30px rgba(0,0,0,.08);
}

.card h3{
  margin-bottom:12px;
  font-size:1.4rem;
}

.card p{
  color:#111827;
  margin-bottom:25px;
  line-height:1.6;
   font-size:1.1rem;
}

.card a{
  display:inline-block;

  text-decoration:none;

  background:#111827;
  color:white;

  padding:12px 22px;

  border-radius:12px;

  font-weight:600;

  transition:.3s ease;
}

.card a:hover{
  background:#374151;
}


/* =========================
   FOOTER
========================= */


/* FOOTER */
footer{
  text-align:center;
  padding:50px 20px;
  border-top:1px solid rgba(255,255,255,0.08);
  background:#1F2937;
}

footer h2{
  margin-bottom:15px;
  font-size:1.6rem;
  color:white;
}

footer p{
  margin-top:10px;
  line-height:1.5;
  font-size:1.1rem;
  color:white;
}





/* =========================
   MOBILE
========================= */

@media(max-width:768px){

  .hero{
    padding-top:140px;
  }

  .hero h1{
    font-size:2.7rem;
  }

  .hero p{
    font-size:1rem;
  }

  .navbar{
    padding:18px 6%;
  }

}

</style>
</head>

<body>


<!-- NAVBAR -->

<nav class="navbar">

  <div class="logo">
    <a href="../index.html">BrainStack</a>
  </div>

  <div class="menu">
    <a href="../index.html">Home</a>
  </div>

</nav>


<!-- HERO -->

<section class="hero">

  <h1> Firebase Backend </h1>

  <p>

Learn authentication, databases, hosting and backend services with Firebase.

  </p>

</section>


<!-- RESOURCES -->

<section class="resources">

<div class="resource-grid">

  <div class="card">
    <h3>📚 Important Resources</h3>
    <p>Reference books, cheat sheets and extra material.</p>
    <a href="#" target="_blank">Open Resources</a>
  </div>

</div>

</section>


<!-- FOOTER -->

<footer>

  <h2>BrainStack</h2>


<p>Learn smarter. Build stronger. Grow faster.</p>


<p>© 2026 BrainStack. All rights reserved.</p>


</footer>

</body>
</html>
