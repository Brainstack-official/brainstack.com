<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#ffffff;
    color:#111827;
    padding:20px;
}

/* NAVBAR */
.navbar{
  position:fixed;
  top:0;
  left:0;
  width:100%;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:18px 8%;

  background:#ffffff;

  backdrop-filter:blur(12px);

  border-bottom: 1px solid #E5E7EB;
  z-index:1000;
}


.logo{
  font-size:1.7rem;
  font-weight:650;
  color: #111827;
}


.nav-links{
  display:flex;
  gap:25px;
}

.nav-links a{
  text-decoration:none;
  color: #111827;
  transition:0.3s;
   font-weight:650;
}

.nav-links a:hover{
  color: #111827;
}

.container{
    max-width:1000px;
    margin:auto;
}

.page-title{
    font-size:2rem;
    font-weight:700;
    margin-bottom:20px;
}

.pdf-table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
    border:1px solid #e5e7eb;
    border-radius:12px;
    overflow:hidden;
}

.pdf-table th{
    background:#f8fafc;
    color:#111827;
     font-size: 1.4rem;
    text-align:left;
    padding:16px;
    border-bottom:1px solid #e5e7eb;
}

.pdf-table td{
    padding:16px;
    border-bottom:1px solid #e5e7eb;
   font-size: 1.4rem;
}

.pdf-table tr:hover{
    background:#f9fafb;
}

.view-btn{
    display:inline-block;
    background:#1F2937;
    color:white;
    text-decoration:none;
    padding:10px 18px;
    border-radius:8px;
    font-weight:600;
    transition:0.3s;
}

.view-btn:hover{
    background:#1F2937;
}

/* FOOTER */

#footer{
    background:#1F2937;
    padding:40px 20px;
    text-align:center;
}

.footer-links{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:25px;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.footer-links a{
    color:white;
    text-decoration:none;
    font-size:23px;
    font-weight:500;
    transition:0.3s;
}

.footer-links a:hover{
    color:#38BDF8;
}

#footer p{
    color:white;
    font-size:25px;
    margin:0;
}


@media(max-width:768px){

    .page-title{
        font-size:1.6rem;
    }

    .pdf-table th,
    .pdf-table td{
        padding:12px;
        font-size:12px;
    }

    .view-btn{
        padding:8px 14px;
        font-size:12px;
    }
 /* FOOTER */

.footer-links{
        flex-direction:rows;
        gap:12px;
    }

    .footer-links a{
        font-size:13px;
    }
  #footer p{
    font-size:0.9rem;
  }

}


@media(max-width:480px){

  .navbar{
    padding:12px 4%;
  }

  .logo{
    font-size:1.3rem;
  }

  .menu a{
    font-size:15px;
  }

}
