<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainStack Profile</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#F9FAFB;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.profile-card{

    width:100%;
    max-width:450px;

    background:white;

    border-radius:25px;

    padding:35px;

    text-align:center;

    border:1px solid #E5E7EB;

    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}

.profile-img{

    width:120px;
    height:120px;

    border-radius:50%;

    object-fit:cover;

    border:4px solid #111827;

    margin-bottom:20px;
}

.profile-email{

    font-size:18px;

    color:#111827;

    font-weight:600;

    margin-bottom:30px;

    word-break:break-word;
}

.dashboard{

    display:flex;
    flex-direction:column;

    gap:15px;

    margin-bottom:30px;
}

.dashboard-item{

    background:#F3F4F6;

    padding:16px;

    border-radius:14px;

    text-align:left;

    font-weight:500;

    color:#111827;

    cursor:pointer;

    transition:.3s;
}

.dashboard-item:hover{

    background:#E5E7EB;
}

.logout-btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:14px;

    background:#111827;

    color:white;

    font-size:16px;

    font-weight:600;

    cursor:pointer;
}

.logout-btn:hover{

    opacity:.9;
}

@media(max-width:600px){

.profile-card{
    padding:25px;
}

.profile-img{
    width:100px;
    height:100px;
}

}

</style>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const supabase = createClient(
"https://waeeeyktjujpvpcprhbv.supabase.co",
"sb_publishable_4HE-L3GRIkDq4wSIaxWyJw_vtngeHdj"
);

const {
    data:{session}
} = await supabase.auth.getSession();

if(!session){

    window.location.href="login.html";

}else{

    const user = session.user;

    window.addEventListener("DOMContentLoaded",()=>{

        document.getElementById("email").innerText =
        user.email;

        const photo =
        document.getElementById("profilePhoto");

        photo.src =
        user.user_metadata.avatar_url ||
        user.user_metadata.picture ||
        "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

    });

}

window.logoutUser = async ()=>{

    await supabase.auth.signOut();

    window.location.href="login.html";
};

</script>

</head>

<body>

<div class="profile-card">

    <img
    id="profilePhoto"
    class="profile-img"
    src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

    <div
    id="email"
    class="profile-email">
        Loading...
    </div>

    <div class="dashboard">

        <div class="dashboard-item">
            📚 Saved Resources
        </div>

        <div class="dashboard-item">
            📄 Downloaded PDFs
        </div>

    </div>

    <button
    class="logout-btn"
    onclick="logoutUser()">
        Logout
    </button>

</div>

</body>
</html>
