<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="description"
content="BrainStack provides engineering notes, programming resources, AI learning materials and career guidance for students.">

<meta name="keywords"
content="engineering notes, mechanical engineering, programming, AI resources, student resources">

<meta name="author"
content="BrainStack">
  

<title>BrainStack Login</title>
  <link rel="icon" type="image/png" href="brainstack.png">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    background:#F9FAFB;
    min-height:100vh;
    padding:20px;
}

.container{

    width:100%;
    max-width:420px;

    background:white;

    padding:40px;

    border-radius:20px;

    box-shadow:
    0 10px 25px rgba(0,0,0,0.08);

    border:1px solid #E5E7EB;
}

.logo{

    text-align:center;

    font-size:1.4rem;

    font-weight:650;

   line-height:1.3;

    color:#111827;

    margin-bottom:10px;
}

.subtitle{

    text-align:center;

    color:#6B7280;

    margin-bottom:30px;
}

input{

    width:100%;

    padding:15px;

    margin-bottom:15px;

    border:1px solid #D1D5DB;

    border-radius:12px;

    outline:none;

    font-size:16px;
}

input:focus{
    border-color:#111827;
}

.btn{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:15px;

    font-weight:600;

    margin-bottom:12px;

    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
}

.login-btn{
    background:#111827;
    color:white;
}

.signup-btn{
    background:#374151;
    color:white;
}

.google-btn{
    background:white;
    color:#111827;
    border:1px solid #D1D5DB;
}

.divider{

    text-align:center;

    margin:20px 0;

    color:#6B7280;
}

#message{

    text-align:center;

    margin-top:15px;

    color:#111827;

    font-size:14px;
}

.login-wrapper{
    min-height:85vh;
    display:flex;
    justify-content:center;
    align-items:center;
}
  
  /* FOOTER */

#footer{
    width:100%;
    background:#1F2937;
    padding:30px 20px;
    text-align:center;
    margin-top:40px;
}

.footer-links{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:15px;
}

.footer-links a{
    color:white;
    text-decoration:none;
    font-size:18px;
    font-weight:500;
}

.footer-links a:hover{
    color:#38BDF8;
}

#footer p{
    color:white;
    font-size:18px;
}

  
@media(max-width:600px){

    .container{
        padding:25px;
    }

    .logo{
        font-size:1.8rem;
    }
  /* FOOTER */

.footer-links{
        flex-direction:row;
        gap:12px;
    }

    .footer-links a{
        font-size:13px;
    }
  #footer p{
    font-size:0.9rem;
  }

}

</style>

<script type="module">

import { createClient }
from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

window.supabase = createClient(
"https://waeeeyktjujpvpcprhbv.supabase.co",
"sb_publishable_4HE-L3GRIkDq4wSIaxWyJw_vtngeHdj"
);

</script>

  
  <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-C3J27V16D2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-C3J27V16D2');
</script>


</head>

<body>
  <div class="login-wrapper">

<div class="container">

    <div class="logo">
        BrainStack Students Resource Platform
    </div>

    <p class="subtitle">
        Login or Create Account to Access Free Resources
    </p>

    <input
    type="email"
    id="email"
    placeholder="Enter your email">

    <input
    type="password"
    id="password"
    placeholder="Enter your password">

    <button
    class="btn login-btn"
    id="loginBtn">
        Login
    </button>

    <button
    class="btn signup-btn"
    id="signupBtn">
        Sign Up
    </button>

    <div class="divider">
        OR
    </div>

    <button
    class="btn google-btn"
    id="googleBtn">
        Continue with Google
    </button>

    <p id="message"></p>

</div>
  </div>

  <!-- FOOTER -->
 <footer id="footer">

    <div class="footer-links">
        <a href="about.html">About Us</a>
        <a href="privacy-policy.html">Privacy Policy</a>
        <a href="terms.html">Terms & Conditions</a>
        <a href="disclaimer.html">Disclaimer</a>
    </div>

    <p>© 2026 BrainStack. All Rights Reserved.</p>

</footer>
  
<script type="module">

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const message =
document.getElementById("message");

document.getElementById("signupBtn")
.addEventListener("click", async () => {

    const { error } =
    await window.supabase.auth.signUp({

        email: email.value,
        password: password.value

    });

    if(error){

        message.innerText =
        error.message;

    }else{

        message.innerText =
        "Account created successfully. Check your email.";

    }

});

document.getElementById("loginBtn")
.addEventListener("click", async () => {

    const { error } =
    await window.supabase.auth.signInWithPassword({

        email: email.value,
        password: password.value

    });

    if(error){

        message.innerText =
        error.message;

    }else{

        window.location.href =
        "index.html";

    }

});

document.getElementById("googleBtn")
.addEventListener("click", async () => {

    await window.supabase.auth.signInWithOAuth({

        provider:"google",

        options:{

            redirectTo:
           "https://brainstack-com.vercel.app/index.html"

        }

    });

});

</script>

</body>
</html>
